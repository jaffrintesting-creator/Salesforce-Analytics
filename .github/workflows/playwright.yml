name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      continue-on-error: true
    - name: Install reporting script dependencies
      run: npm install
      working-directory: ./reporting
    - name: Build reporting scripts
      run: npm run build
      working-directory: ./reporting
    - name: Apply database schema
      run: node -e "const initSqlJs = require('sql.js'); const fs = require('fs'); initSqlJs().then(SQL => { const db = new SQL.Database(); db.run(fs.readFileSync('schema.sql', 'utf-8')); fs.writeFileSync('qa.db', Buffer.from(db.export())); console.log('schema applied'); });"
      working-directory: ./reporting
    - name: Export test results to QA database
      run: |
        node export-results.js \
          --results ../test-results/results.json \
          --db qa.db \
          --ci-pipeline "${{ github.workflow }}" \
          --branch "${{ github.ref_name }}" \
          --org-id "SBX-UAT-01"
      working-directory: ./reporting
    - name: Export QA database to CSV
      run: node export-to-csv.js --db qa.db --out ./csv-export
      working-directory: ./reporting
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: qa-database
        path: reporting/qa.db
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: qa-csv-export
        path: reporting/csv-export/
        retention-days: 30